<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Gradient definitions with calm, WCAG AAA compliant colors -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f2744;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#132e4a;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="spiritGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9ead;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#2d7a8a;stop-opacity:0.4" />
    </linearGradient>
    
    <linearGradient id="techGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3d8b6e;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#5ba88a;stop-opacity:0.3" />
    </linearGradient>
    
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a962;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#a68b4b;stop-opacity:0.5" />
    </linearGradient>
    
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#4a9ead;stop-opacity:0.3" />
      <stop offset="70%" style="stop-color:#2d7a8a;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#0a1628;stop-opacity:0" />
    </radialGradient>
    
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#5ba88a;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#3d8b6e;stop-opacity:0" />
    </radialGradient>
    
    <!-- Filter for soft glow effects -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Pattern for circuit-like background -->
    <pattern id="circuitPattern" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="transparent"/>
      <line x1="0" y1="50" x2="40" y2="50" stroke="#2d5a6e" stroke-width="0.5" opacity="0.3"/>
      <line x1="60" y1="50" x2="100" y2="50" stroke="#2d5a6e" stroke-width="0.5" opacity="0.3"/>
      <line x1="50" y1="0" x2="50" y2="40" stroke="#2d5a6e" stroke-width="0.5" opacity="0.3"/>
      <line x1="50" y1="60" x2="50" y2="100" stroke="#2d5a6e" stroke-width="0.5" opacity="0.3"/>
      <circle cx="50" cy="50" r="2" fill="#3d8b6e" opacity="0.4"/>
    </pattern>
    
    <!-- Clip paths for sacred geometry -->
    <clipPath id="flowerClip">
      <circle cx="960" cy="540" r="280"/>
    </clipPath>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)"/>
  
  <!-- Subtle circuit pattern overlay -->
  <rect width="100%" height="100%" fill="url(#circuitPattern)" opacity="0.4"/>
  
  <!-- Central radial glow -->
  <ellipse cx="960" cy="540" rx="600" ry="400" fill="url(#centerGlow)"/>
  
  <!-- Outer geometric ring - Technology representation -->
  <g opacity="0.6">
    <!-- Hexagonal tech pattern -->
    <polygon points="960,180 1130,280 1130,480 960,580 790,480 790,280" 
             fill="none" stroke="url(#techGradient)" stroke-width="1.5" 
             transform="rotate(0, 960, 540) translate(0, -40)"/>
    <polygon points="960,180 1130,280 1130,480 960,580 790,480 790,280" 
             fill="none" stroke="url(#techGradient)" stroke-width="1" 
             transform="rotate(30, 960, 540) scale(1.2) translate(0, -40)" opacity="0.5"/>
    <polygon points="960,180 1130,280 1130,480 960,580 790,480 790,280" 
             fill="none" stroke="url(#techGradient)" stroke-width="0.8" 
             transform="rotate(60, 960, 540) scale(1.4) translate(0, -40)" opacity="0.3"/>
  </g>
  
  <!-- Sacred Geometry - Flower of Life pattern (Spirituality) -->
  <g filter="url(#subtleGlow)" opacity="0.7">
    <!-- Central circle -->
    <circle cx="960" cy="540" r="80" fill="none" stroke="url(#spiritGlow)" stroke-width="1.5"/>
    
    <!-- First ring of circles -->
    <circle cx="960" cy="460" r="80" fill="none" stroke="url(#spiritGlow)" stroke-width="1"/>
    <circle cx="1029" cy="500" r="80" fill="none" stroke="url(#spiritGlow)" stroke-width="1"/>
    <circle cx="1029" cy="580" r="80" fill="none" stroke="url(#spiritGlow)" stroke-width="1"/>
    <circle cx="960" cy="620" r="80" fill="none" stroke="url(#spiritGlow)" stroke-width="1"/>
    <circle cx="891" cy="580" r="80" fill="none" stroke="url(#spiritGlow)" stroke-width="1"/>
    <circle cx="891" cy="500" r="80" fill="none" stroke="url(#spiritGlow)" stroke-width="1"/>
    
    <!-- Outer ring -->
    <circle cx="960" cy="380" r="80" fill="none" stroke="url(#spiritGlow)" stroke-width="0.7" opacity="0.6"/>
    <circle cx="1029" cy="420" r="80" fill="none" stroke="url(#spiritGlow)" stroke-width="0.7" opacity="0.6"/>
    <circle cx="1098" cy="460" r="80" fill="none" stroke="url(#spiritGlow)" stroke-width="0.7" opacity="0.6"/>
    <circle cx="1098" cy="540" r="80" fill="none" stroke="url(#spiritGlow)" stroke-width="0.7" opacity="0.6"/>
    <circle cx="1098" cy="620" r="80" fill="none" stroke="url(#spiritGlow)" stroke-width="0.7" opacity="0.6"/>
    <circle cx="1029" cy="660" r="80" fill="none" stroke="url(#spiritGlow)" stroke-width="0.7" opacity="0.6"/>
    <circle cx="960" cy="700" r="80" fill="none" stroke="url(#spiritGlow)" stroke-width="0.7" opacity="0.6"/>
    <circle cx="891" cy="660" r="80" fill="none" stroke="url(#spiritGlow)" stroke-width="0.7" opacity="0.6"/>
    <circle cx="822" cy="620" r="80" fill="none" stroke="url(#spiritGlow)" stroke-width="0.7" opacity="0.6"/>
    <circle cx="822" cy="540" r="80" fill="none" stroke="url(#spiritGlow)" stroke-width="0.7" opacity="0.6"/>
    <circle cx="822" cy="460" r="80" fill="none" stroke="url(#spiritGlow)" stroke-width="0.7" opacity="0.6"/>
    <circle cx="891" cy="420" r="80" fill="none" stroke="url(#spiritGlow)" stroke-width="0.7" opacity="0.6"/>
  </g>
  
  <!-- Network connections - Technology/Data flow -->
  <g stroke="url(#techGradient)" stroke-width="0.8" fill="none" opacity="0.5">
    <!-- Left side connections -->
    <path d="M 200,200 Q 400,300 500,400" filter="url(#subtleGlow)"/>
    <path d="M 150,400 Q 350,450 550,480"/>
    <path d="M 100,600 Q 300,550 500,520"/>
    <path d="M 180,750 Q 380,650 580,580"/>
    <path d="M 250,900 Q 450,750 650,620"/>
    
    <!-- Right side connections -->
    <path d="M 1720,200 Q 1520,300 1420,400" filter="url(#subtleGlow)"/>
    <path d="M 1770,400 Q 1570,450 1370,480"/>
    <path d="M 1820,600 Q 1620,550 1420,520"/>
    <path d="M 1740,750 Q 1540,650 1340,580"/>
    <path d="M 1670,900 Q 1470,750 1270,620"/>
    
    <!-- Cross connections -->
    <path d="M 500,400 Q 730,470 960,540" opacity="0.4"/>
    <path d="M 1420,400 Q 1190,470 960,540" opacity="0.4"/>
    <path d="M 650,620 Q 805,580 960,540" opacity="0.4"/>
    <path d="M 1270,620 Q 1115,580 960,540" opacity="0.4"/>
  </g>
  
  <!-- Data nodes -->
  <g filter="url(#softGlow)">
    <!-- Left nodes -->
    <circle cx="200" cy="200" r="4" fill="url(#nodeGlow)"/>
    <circle cx="150" cy="400" r="3" fill="url(#nodeGlow)"/>
    <circle cx="100" cy="600" r="5" fill="url(#nodeGlow)"/>
    <circle cx="180" cy="750" r="3" fill="url(#nodeGlow)"/>
    <circle cx="250" cy="900" r="4" fill="url(#nodeGlow)"/>
    <circle cx="400" cy="300" r="2" fill="#5ba88a" opacity="0.7"/>
    <circle cx="350" cy="500" r="2" fill="#5ba88a" opacity="0.7"/>
    <circle cx="300" cy="700" r="2" fill="#5ba88a" opacity="0.7"/>
    
    <!-- Right nodes -->
    <circle cx="1720" cy="200" r="4" fill="url(#nodeGlow)"/>
    <circle cx="1770" cy="400" r="3" fill="url(#nodeGlow)"/>
    <circle cx="1820" cy="600" r="5" fill="url(#nodeGlow)"/>
    <circle cx="1740" cy="750" r="3" fill="url(#nodeGlow)"/>
    <circle cx="1670" cy="900" r="4" fill="url(#nodeGlow)"/>
    <circle cx="1520" cy="300" r="2" fill="#5ba88a" opacity="0.7"/>
    <circle cx="1570" cy="500" r="2" fill="#5ba88a" opacity="0.7"/>
    <circle cx="1620" cy="700" r="2" fill="#5ba88a" opacity="0.7"/>
  </g>
  
  <!-- Central Metatron's Cube outline (Sacred Geometry meets Technology) -->
  <g transform="translate(960, 540)" filter="url(#softGlow)" opacity="0.8">
    <!-- Inner hexagon -->
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" 
             fill="none" stroke="url(#goldAccent)" stroke-width="1.5"/>
    
    <!-- Connecting lines to outer points -->
    <line x1="0" y1="-60" x2="0" y2="-120" stroke="url(#goldAccent)" stroke-width="1"/>
    <line x1="52" y1="-30" x2="104" y2="-60" stroke="url(#goldAccent)" stroke-width="1"/>
    <line x1="52" y1="30" x2="104" y2="60" stroke="url(#goldAccent)" stroke-width="1"/>
    <line x1="0" y1="60" x2="0" y2="120" stroke="url(#goldAccent)" stroke-width="1"/>
    <line x1="-52" y1="30" x2="-104" y2="60" stroke="url(#goldAccent)" stroke-width="1"/>
    <line x1="-52" y1="-30" x2="-104" y2="-60" stroke="url(#goldAccent)" stroke-width="1"/>
    
    <!-- Outer hexagon -->
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60" 
             fill="none" stroke="url(#goldAccent)" stroke-width="1" opacity="0.7"/>
    
    <!-- Cross lines creating the cube illusion -->
    <line x1="0" y1="-120" x2="104" y2="60" stroke="url(#goldAccent)" stroke-width="0.5" opacity="0.5"/>
    <line x1="0" y1="-120" x2="-104" y2="60" stroke="url(#goldAccent)" stroke-width="0.5" opacity="0.5"/>
    <line x1="104" y1="-60" x2="-104" y2="60" stroke="url(#goldAccent)" stroke-width="0.5" opacity="0.5"/>
    <line x1="104" y1="-60" x2="0" y2="120" stroke="url(#goldAccent)" stroke-width="0.5" opacity="0.5"/>
    <line x1="-104" y1="-60" x2="104" y2="60" stroke="url(#goldAccent)" stroke-width="0.5" opacity="0.5"/>
    <line x1="-104" y1="-60" x2="0" y2="120" stroke="url(#goldAccent)" stroke-width="0.5" opacity="0.5"/>
    
    <!-- Center point -->
    <circle cx="0" cy="0" r="6" fill="url(#goldAccent)"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="url(#goldAccent)" stroke-width="0.5" opacity="0.6"/>
  </g>
  
  <!-- Orbital rings - Representing cosmic/atomic duality -->
  <g fill="none" stroke-width="0.8" opacity="0.4">
    <ellipse cx="960" cy="540" rx="320" ry="100" stroke="url(#spiritGlow)" transform="rotate(-20, 960, 540)"/>
    <ellipse cx="960" cy="540" rx="320" ry="100" stroke="url(#techGradient)" transform="rotate(40, 960, 540)"/>
    <ellipse cx="960" cy="540" rx="320" ry="100" stroke="url(#spiritGlow)" transform="rotate(100, 960, 540)"/>
  </g>
  
  <!-- Floating particles - Representing energy/data -->
  <g fill="#4a9ead" opacity="0.6">
    <circle cx="680" cy="320" r="2">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1240" cy="360" r="1.5">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="760" r="2">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1200" cy="720" r="1.5">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="580" cy="480" r="1">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1340" cy="520" r="1">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <g fill="#5ba88a" opacity="0.5">
    <circle cx="480" cy="280" r="1.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1440" cy="300" r="2">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="800" r="1">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1400" cy="780" r="1.5">
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Corner decorative elements - subtle tech accent -->
  <g stroke="#2d5a6e" stroke-width="0.5" fill="none" opacity="0.4">
    <!-- Top left -->
    <path d="M 0,80 L 80,80 L 80,0"/>
    <path d="M 0,120 L 120,120 L 120,0"/>
    <circle cx="80" cy="80" r="3" fill="#3d8b6e"/>
    
    <!-- Top right -->
    <path d="M 1920,80 L 1840,80 L 1840,0"/>
    <path d="M 1920,120 L 1800,120 L 1800,0"/>
    <circle cx="1840" cy="80" r="3" fill="#3d8b6e"/>
    
    <!-- Bottom left -->
    <path d="M 0,1000 L 80,1000 L 80,1080"/>
    <path d="M 0,960 L 120,960 L 120,1080"/>
    <circle cx="80" cy="1000" r="3" fill="#3d8b6e"/>
    
    <!-- Bottom right -->
    <path d="M 1920,1000 L 1840,1000 L 1840,1080"/>
    <path d="M 1920,960 L 1800,960 L 1800,1080"/>
    <circle cx="1840" cy="1000" r="3" fill="#3d8b6e"/>
  </g>
  
  <!-- Subtle wave patterns - representing energy/consciousness -->
  <g stroke="url(#spiritGlow)" stroke-width="0.5" fill="none" opacity="0.2">
    <path d="M 0,540 Q 240,500 480,540 T 960,540 T 1440,540 T 1920,540"/>
    <path d="M 0,520 Q 240,480 480,520 T 960,520 T 1440,520 T 1920,520"/>
    <path d="M 0,560 Q 240,520 480,560 T 960,560 T 1440,560 T 1920,560"/>
  </g>
  
</svg>
