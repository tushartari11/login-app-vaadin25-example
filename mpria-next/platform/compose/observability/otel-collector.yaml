# OpenTelemetry Collector — the only component that knows where telemetry goes.
#
# Services export OTLP and nothing else. Swapping Prometheus for Mimir, or Tempo for Jaeger, is a
# change to this file, not to application code. That is the whole point of routing through a
# collector rather than wiring exporters into services (ARCHITECTURE.md §11).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Bound memory before the collector becomes the thing that falls over.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

  batch:
    timeout: 5s
    send_batch_size: 1024

  # Every signal carries the deployment identity, so one Grafana can serve several environments.
  resource:
    attributes:
      - key: deployment.environment
        value: local
        action: upsert

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

  # Traces. Tempo is not in the compose file yet; until it is, traces are logged so the pipeline
  # is demonstrably wired end to end rather than silently discarded.
  debug:
    verbosity: normal

  opensearch:
    http:
      endpoint: http://opensearch:9200
      tls:
        insecure: true
    logs_index: mpria-logs

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [opensearch]
  telemetry:
    logs:
      level: info
