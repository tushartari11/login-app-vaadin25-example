# MpRIA Next — local stack.
#
# Default `docker compose up -d` starts only the infrastructure a developer needs (Postgres and
# Keycloak); services then run from the IDE or from `mvn spring-boot:run`. That is the fast loop.
#
# Optional profiles:
#   --profile apps           the three services as containers (requires `mvn package` first)
#   --profile observability  OpenTelemetry collector, Prometheus, Grafana, OpenSearch + Dashboards
#
# Everything here is self-hostable OSS. That is a constraint, not a coincidence: the MVP ships
# on-premises, so no managed cloud service may become structural (ARCHITECTURE.md, principle P7).

name: mpria-next

services:

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mpria
      POSTGRES_PASSWORD: mpria
      POSTGRES_DB: mpria_catalog
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mpria -d mpria_catalog"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8180"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8180"
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The management port serves health from Keycloak 25 onwards.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ---------------------------------------------------------------- profile: apps

  catalog-service:
    profiles: ["apps"]
    build:
      context: ../../services/catalog-service
      dockerfile: ../../platform/compose/Dockerfile.service
    environment:
      CATALOG_DB_URL: jdbc:postgresql://postgres:5432/mpria_catalog
      CATALOG_DB_USER: mpria
      CATALOG_DB_PASSWORD: mpria
      OIDC_ISSUER_URI: http://keycloak:8180/realms/mpria
      CONFIG_SERVICE_URL: http://config-service:8082
      SERVER_PORT: "8081"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  config-service:
    profiles: ["apps"]
    build:
      context: ../../services/config-service
      dockerfile: ../../platform/compose/Dockerfile.service
    environment:
      OIDC_ISSUER_URI: http://keycloak:8180/realms/mpria
      SERVER_PORT: "8082"
    ports:
      - "8082:8082"
    depends_on:
      keycloak:
        condition: service_healthy

  presentation-bff:
    profiles: ["apps"]
    build:
      context: ../../services/presentation-bff
      dockerfile: ../../platform/compose/Dockerfile.service
    environment:
      OIDC_ISSUER_URI: http://keycloak:8180/realms/mpria
      CONFIG_SERVICE_URL: http://config-service:8082
      CATALOG_SERVICE_URL: http://catalog-service:8081
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      catalog-service:
        condition: service_started
      config-service:
        condition: service_started

  # ------------------------------------------------------- profile: observability

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.119.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.1.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.5.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  # OpenSearch serves double duty: the search index (ADR-0006) and the log store, which is why
  # "ELK logging" here is OpenSearch + Dashboards rather than a second Elastic cluster.
  opensearch:
    profiles: ["observability"]
    image: opensearchproject/opensearch:2.19.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "9200:9200"

  opensearch-dashboards:
    profiles: ["observability"]
    image: opensearchproject/opensearch-dashboards:2.19.0
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    depends_on:
      - opensearch

volumes:
  postgres-data:
