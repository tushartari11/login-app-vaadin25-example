spring:
  application:
    name: presentation-bff

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/mpria}

  http:
    clients:
      # Every outbound client, configured once. Short by design: this service is on the critical
      # path of every screen, so waiting on a hung upstream costs a request that could have failed
      # fast and been retried. Note the plural — spring.http.client.* is deprecated since Boot 4.0.
      connect-timeout: 2s
      read-timeout: 5s

  threads:
    virtual:
      # Java 21 virtual threads. This service fans out to two other services per request and does
      # nothing but wait on them; a platform thread per request would be the first thing to run out
      # under load, and virtual threads buy that without a reactive rewrite (ADR-0001).
      enabled: true

mpria:
  config-service:
    base-url: ${CONFIG_SERVICE_URL:http://localhost:8082}
  catalog-service:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8081}

server:
  port: ${SERVER_PORT:8080}
  # In-flight screens finish assembling before the process exits, so a rolling deploy does not
  # answer a save with a dropped connection.
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.zetcom.mpria: INFO
