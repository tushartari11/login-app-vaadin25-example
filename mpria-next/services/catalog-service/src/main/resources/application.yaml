spring:
  application:
    name: catalog-service

  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/mpria_catalog}
    username: ${CATALOG_DB_USER:mpria}
    password: ${CATALOG_DB_PASSWORD:mpria}

  jpa:
    # Flyway owns the schema. Hibernate must never touch DDL: a rolling deploy with two
    # application versions live would otherwise race on it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/mpria}

  threads:
    virtual:
      # Java 21 virtual threads: the fan-out in the BFF and the blocking JDBC calls here both stay
      # readable without a reactive rewrite (ADR-0001).
      enabled: true

mpria:
  config-service:
    base-url: ${CONFIG_SERVICE_URL:http://localhost:8082}
    timeout: 3s

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.zetcom.mpria: INFO
