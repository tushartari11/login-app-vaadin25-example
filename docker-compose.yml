services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # "production" = precompiled frontend bundle. The image has no Node.js and no mounted sources,
        # so Vaadin dev mode (MAVEN_PROFILE=development) is meant for running from the IDE instead.
        - MAVEN_PROFILE=${MAVEN_PROFILE:-production}
    container_name: vaadin-payara-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-vaadindb}
      - DB_USER=${DB_USER:-vaadinuser}
      - DB_PASSWORD=${DB_PASSWORD:-vaadinpass}
      - JVM_ARGS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:9009
    ports:
      - "8080:8080"
      - "8181:8181"
      - "4848:4848"
      - "9009:9009"
    networks:
      - vaadin-network
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: vaadin-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-vaadindb}
      POSTGRES_USER: ${DB_USER:-vaadinuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vaadinpass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vaadinuser} -d ${DB_NAME:-vaadindb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vaadin-network
    restart: unless-stopped

volumes:
  pgdata:
    driver: local

networks:
  vaadin-network:
    driver: bridge
